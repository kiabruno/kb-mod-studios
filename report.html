<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="KB Mod Studios – Diese Seite befindet sich derzeit in Wartung.">

    <title>KB Mod Studios | Wartung</title>

    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0d10;
            color: #ffffff;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 45px;
        }

        .logo span {
            color: #55d68a;
        }

        .icon {
            width: 90px;
            height: 90px;

            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            background: rgba(85, 214, 138, 0.1);
            border: 1px solid rgba(85, 214, 138, 0.3);

            font-size: 42px;
        }

        h1 {
            font-size: clamp(40px, 7vw, 65px);
            margin-bottom: 20px;
        }

        h1 span {
            color: #55d68a;
        }

        p {
            color: #aeb4bb;
            font-size: 18px;
            line-height: 1.7;
            max-width: 600px;
            margin: 0 auto;
        }

        .status {
            display: inline-block;

            margin-top: 30px;
            padding: 10px 18px;

            border-radius: 999px;

            color: #55d68a;
            background: rgba(85, 214, 138, 0.08);

            border: 1px solid rgba(85, 214, 138, 0.3);

            font-size: 14px;
            font-weight: 700;
        }

        .back {
            display: inline-block;

            margin-top: 35px;
            padding: 13px 23px;

            border-radius: 9px;

            background: #55d68a;
            color: #08100b;

            text-decoration: none;
            font-weight: 700;

            transition: 0.2s ease;
        }

        .back:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
        }

        footer {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;

            text-align: center;

            color: #747b83;
            font-size: 13px;
        }

        footer strong {
            color: #55d68a;
        }

        @media (max-width: 500px) {

            .logo {
                font-size: 22px;
            }

            p {
                font-size: 16px;
            }

            .icon {
                width: 75px;
                height: 75px;
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">
            KB <span>MOD STUDIOS</span>
        </div>

        <div class="icon">
            🔧
        </div>

        <h1>
            Seite in <span>Wartung</span>
        </h1>

        <p>
            Diese Seite wird momentan von KB Mod Studios
            gewartet und überarbeitet.
            Bitte schaue später noch einmal vorbei.
        </p>

        <div class="status">
            ⚙ WARTUNG AKTIV
        </div>

        <br>

        <a class="back" href="index.html">
            Zur Startseite
        </a>

    </div>

    <footer>
        © 2026 <strong>KB Mod Studios</strong>. Alle Rechte vorbehalten.
    </footer>

</body>
</html>
